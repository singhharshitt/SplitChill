services:
  - type: web
    name: splitchill-api
    env: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_TTL_MS
        value: 2592000000
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 300
      - key: REDIS_URL
        sync: false
      - key: SOCKET_REDIS_URL
        sync: false
      - key: HYPERSWITCH_API_KEY
        sync: false
      - key: HYPERSWITCH_WEBHOOK_SECRET
        sync: false
