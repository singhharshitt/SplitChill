services:
  - type: web
    name: splitchill-api
    env: node
    rootDir: server
    plan: free
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_TTL_MS
        value: 2592000000
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 300
      - key: GROQ_API_KEY
        sync: false
      - key: OCRSPACE_API_KEY
        sync: false
      - key: DEMO_AUTH_ENABLED
        value: false

  - type: web
    name: splitchill-client
    env: static
    rootDir: client
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
