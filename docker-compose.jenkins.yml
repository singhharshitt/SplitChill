name: splitchill-jenkins

services:
  jenkins:
    build:
      context: .
      dockerfile: docker/jenkins/Dockerfile
    image: splitchill/jenkins:lts-jdk17-docker-cli
    restart: unless-stopped
    ports:
      - "${JENKINS_PORT:-8082}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      JAVA_OPTS: ${JENKINS_JAVA_OPTS:--Djenkins.install.runSetupWizard=true}
      DOCKER_HOST: unix:///docker-socket/docker.sock
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - jenkins_home:/var/jenkins_home
      - docker_socket:/docker-socket
    depends_on:
      docker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  docker:
    build:
      context: .
      dockerfile: docker/jenkins-dind/Dockerfile
    image: splitchill/docker-dind:29-jenkins-socket
    privileged: true
    restart: unless-stopped
    command: ["--storage-driver=overlay2"]
    environment:
      DOCKER_HOST: unix:///docker-socket/docker.sock
      DOCKER_TLS_CERTDIR: ""
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - jenkins_home:/var/jenkins_home
      - docker_socket:/docker-socket
      - docker_data:/var/lib/docker

volumes:
  jenkins_home:
    name: jenkins_home
  docker_socket:
    name: splitchill_jenkins_docker_socket
  docker_data:
    name: splitchill_jenkins_docker_data
