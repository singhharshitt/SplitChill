services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/splitchill
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: local-dev-secret-change-me
      REDIS_URL: redis://redis:6379
      SOCKET_REDIS_URL: redis://redis:6379
      QUEUE_PREFIX: splitchill_q
      HYPERSWITCH_BASE_URL: http://host.docker.internal:8080
      HYPERSWITCH_API_KEY: dev-hyperswitch-api-key
      HYPERSWITCH_WEBHOOK_SECRET: dev-hyperswitch-webhook-secret
      TEXTBEE_BASE_URL: https://api.textbee.dev/api/v1
      TEXTBEE_API_KEY: ""
      TEXTBEE_DEVICE_ID: ""
      TEXTBEE_WEBHOOK_SECRET: dev-textbee-webhook-secret
    volumes:
      - ./server:/app
    command: sh -c "npm install && npm run dev"

  client:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    volumes:
      - ./client:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mongo-data:
  redis-data:
