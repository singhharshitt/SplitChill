name: splitchill

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    image: ${SERVER_IMAGE:-splitchill/server}:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-5001}:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/splitchill?replicaSet=rs0
      MONGODB_URI: mongodb://mongo:27017/splitchill?replicaSet=rs0
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-1234}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-dev-refresh-secret-change-me-1234}
      REDIS_URL: redis://redis:6379
      SOCKET_REDIS_URL: redis://redis:6379
      HYPERSWITCH_BASE_URL: ${HYPERSWITCH_BASE_URL:-http://host.docker.internal:8080}
      HYPERSWITCH_API_KEY: ${HYPERSWITCH_API_KEY:-dev-hyperswitch-api-key}
      HYPERSWITCH_WEBHOOK_SECRET: ${HYPERSWITCH_WEBHOOK_SECRET:-dev-hyperswitch-webhook-secret}
      TEXTBEE_BASE_URL: ${TEXTBEE_BASE_URL:-https://api.textbee.dev/api/v1}
      TEXTBEE_API_KEY: ${TEXTBEE_API_KEY:-}
      TEXTBEE_DEVICE_ID: ${TEXTBEE_DEVICE_ID:-}
      TEXTBEE_WEBHOOK_SECRET: ${TEXTBEE_WEBHOOK_SECRET:-dev-textbee-webhook-secret}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-true}
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health/ready | grep -q '\"ready\":true'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development
    image: ${CLIENT_IMAGE:-splitchill/client}:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5001/api}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5001}
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
  redis-data:
  server-node-modules:
  client-node-modules:
