name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [client, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: Lint client
        if: matrix.app == 'client'
        working-directory: client
        run: npm run lint
      - name: Build client
        if: matrix.app == 'client'
        working-directory: client
        run: npm run build
      - name: Syntax check server
        if: matrix.app == 'server'
        working-directory: server
        run: node --check index.js && node --check src/app.js && npm test
